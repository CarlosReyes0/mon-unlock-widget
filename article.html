<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6E54FF" />
    <meta name="apple-mobile-web-app-title" content="Open Paywall" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
    <title>Article — Open Paywall</title>
    <meta name="description" content="Read this article on Open Paywall. One unlock works here and on the publisher’s site." />
    <link rel="stylesheet" href="/dist/openpaywall.css" />
    <script type="module" src="/dist/openpaywall.js?v=20240714"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111827;
        --muted: #57534e;
        --soft: #78716c;
        --line: #e7e5e4;
        --surface: #ffffff;
        --accent: #0f766e;
        --page-pad: 2rem;
        --font-serif: "Literata", Georgia, serif;
        --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, #ecfeff 0%, transparent 28%),
          var(--surface);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(42rem, 100%);
        margin: 0 auto;
        padding: 1.25rem var(--page-pad) 3rem;
      }
      .back {
        display: inline-flex;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: var(--muted);
        text-decoration: none;
      }
      .back:hover { color: var(--accent); }
      .meta {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
        color: var(--soft);
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem 0.75rem;
        align-items: center;
      }
      .meta a { color: inherit; }
      .meta a:hover { color: var(--accent); }
      #followPrompt { margin-top: 1.25rem; }
      .also {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .also a { color: var(--accent); }
      .status {
        margin: 2rem 0;
        color: var(--muted);
      }
      .status.error { color: #b91c1c; }
      #paywallHost {
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="site-nav"></div>
      <a class="back" href="/articles">← All articles</a>
      <p class="meta" id="meta" hidden>
        <span id="byline"></span>
        <span id="followSlot"></span>
      </p>
      <p class="also" id="also" hidden></p>
      <div id="paywallHost"></div>
      <aside id="followPrompt" hidden>
        <p id="followPromptCopy"></p>
        <div id="followPromptSlot"></div>
      </aside>
      <p class="status" id="status">Loading article…</p>
      <div id="site-footer"></div>
    </div>
    <script src="/site-nav.js"></script>
    <script src="/follow.js"></script>
    <script>
      (function () {
        const SUPABASE_URL = "https://flczjqljgntmkanipugo.supabase.co";
        const SUPABASE_ANON_KEY =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsY3pqcWxqZ250bWthbmlwdWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MTUwNjQsImV4cCI6MjA5NzQ5MTA2NH0.ZKcFJ_4ZI4oK4hyZtR72vqC_JCdwttZSQQw82uTMEb4";
        const WC_PROJECT_ID = "c2a289e11ad2998f8ea4633db536334c";
        const MON_CONTRACT = "0x27cA0c23835328e2Ab1424b66330be86fe177FA6";
        const USDC_CONTRACT = "0xd66Df017335ae80BcE5d4Ec728421f3a3DAf6f9f";

        function slugFromLocation() {
          const params = new URLSearchParams(location.search);
          const q = params.get("slug");
          if (q) return q.trim();
          const parts = location.pathname.split("/").filter(Boolean);
          if (parts[0] === "articles" && parts[1]) {
            return decodeURIComponent(parts[1]);
          }
          return "";
        }

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function formatPriceDisplay(priceWei, paymentAsset) {
          try {
            const n = BigInt(priceWei);
            if (paymentAsset === "usdc") {
              const whole = n / 1000000n;
              const frac = n % 1000000n;
              const fracStr = frac.toString().padStart(6, "0").replace(/0+$/, "");
              return fracStr ? `${whole}.${fracStr}` : String(whole);
            }
            const whole = n / 10n ** 18n;
            const frac = n % 10n ** 18n;
            const fracStr = frac.toString().padStart(18, "0").slice(0, 4).replace(/0+$/, "");
            return fracStr ? `${whole}.${fracStr}` : String(whole);
          } catch {
            return paymentAsset === "usdc" ? "0.50" : "1";
          }
        }

        async function loadArticle(slug) {
          try {
            const res = await fetch(`/api/articles/${encodeURIComponent(slug)}`);
            if (res.ok) {
              const data = await res.json();
              return data.article;
            }
            if (res.status === 404) return null;
          } catch {
            /* fall through to supabase */
          }

          const qs =
            "select=article_id,title,author,teaser,price_wei,payment_asset,publisher,external_url,embed_sig,listing_status,allow_a_la_carte" +
            `&article_id=eq.${encodeURIComponent(slug)}&listing_status=eq.listed&limit=1`;
          const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?${qs}`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          });
          if (!res.ok) throw new Error("load_failed");
          const rows = await res.json();
          const row = rows && rows[0];
          if (!row) return null;
          const paymentAsset = row.payment_asset === "usdc" ? "usdc" : "mon";
          return {
            slug: row.article_id,
            title: row.title || row.article_id,
            author: row.author || "Author",
            teaser: row.teaser || "",
            priceWei: String(row.price_wei || "0"),
            paymentAsset,
            externalUrl: row.external_url || null,
            embedSig: row.embed_sig || "",
            unlockContract: paymentAsset === "usdc" ? USDC_CONTRACT : MON_CONTRACT,
            publisher: row.publisher || "",
            allowALaCarte: row.allow_a_la_carte !== false,
            plan: null,
          };
        }

        function mountPaywall(article) {
          const host = document.getElementById("paywallHost");
          const price = formatPriceDisplay(article.priceWei, article.paymentAsset);
          const widget = document.createElement("open-paywall");
          widget.setAttribute("article-id", article.slug);
          widget.setAttribute("title", article.title);
          widget.setAttribute("author", article.author);
          widget.setAttribute("price", price);
          widget.setAttribute("payment-asset", article.paymentAsset);
          widget.setAttribute(
            "unlock-contract",
            article.unlockContract ||
              (article.paymentAsset === "usdc" ? USDC_CONTRACT : MON_CONTRACT)
          );
          widget.setAttribute("walletconnect-project-id", WC_PROJECT_ID);
          if (article.embedSig) {
            widget.setAttribute("embed-sig", article.embedSig);
          }
          if (article.publisher) {
            widget.setAttribute("publisher", article.publisher);
          }
          if (article.allowALaCarte === false) {
            widget.setAttribute("allow-a-la-carte", "false");
          }
          if (article.plan && article.plan.offered && article.plan.monthlyPriceCents) {
            widget.setAttribute(
              "subscription-price",
              String((article.plan.monthlyPriceCents / 100).toFixed(2)).replace(/\.00$/, "")
            );
          }

          const teaser = document.createElement("div");
          teaser.setAttribute("slot", "teaser");
          // Widget sanitizes HTML teasers on render. Assign as text so a
          // malicious teaser cannot run script via innerHTML before the widget mounts.
          teaser.textContent = article.teaser || "";
          widget.appendChild(teaser);
          // Body intentionally omitted — widget fetches from article-body after unlock
          host.replaceChildren(widget);
        }

        async function main() {
          const status = document.getElementById("status");
          const slug = slugFromLocation();
          if (!slug) {
            status.className = "status error";
            status.textContent = "Missing article slug.";
            return;
          }

          try {
            const article = await loadArticle(slug);
            if (!article) {
              status.className = "status error";
              status.textContent = "This article is not listed on Open Paywall.";
              return;
            }

            document.title = `${article.title} — Open Paywall`;
            const meta = document.getElementById("meta");
            meta.hidden = false;
            const byline = document.getElementById("byline");
            const writer = String(article.publisher || "").toLowerCase();
            if (/^0x[a-f0-9]{40}$/.test(writer)) {
              byline.textContent = "";
              const label = document.createTextNode("By ");
              const link = document.createElement("a");
              link.href = `/writers/${writer}`;
              link.textContent = article.author || "Author";
              byline.append(label, link);
              window.OpenPaywallFollow.mount(document.getElementById("followSlot"), {
                writer,
                author: article.author || "Author",
                via: "article",
                allowWallet: true,
                primary: true,
              });
            } else {
              byline.textContent = `By ${article.author}`;
            }

            if (article.externalUrl) {
              const also = document.getElementById("also");
              also.hidden = false;
              also.innerHTML = `Also published at <a href="${escapeHtml(
                article.externalUrl
              )}" rel="noopener noreferrer" target="_blank">${escapeHtml(
                String(article.externalUrl).replace(/^https?:\/\//, "")
              )}</a>`;
            }

            mountPaywall(article);
            status.hidden = true;
            const params = new URLSearchParams(location.search);
            if (params.get("unlock") === "1") {
              const host = document.getElementById("paywallHost");
              requestAnimationFrame(() => {
                host.scrollIntoView({ behavior: "smooth", block: "center" });
                const focusPay = () => {
                  const widget = host.querySelector("open-paywall");
                  const root = widget && widget.shadowRoot;
                  const button = root && root.querySelector("button");
                  if (button) button.focus();
                };
                setTimeout(focusPay, 400);
              });
            }
            document.getElementById("paywallHost").addEventListener("mon:unlocked", async (event) => {
              const prompt = document.getElementById("followPrompt");
              const copy = document.getElementById("followPromptCopy");
              const name = article.author || "this writer";
              copy.textContent = `Enjoyed this? Follow ${name} free. Get the next post by email.`;
              prompt.hidden = false;
              let prefill = "";
              const session = event.detail && event.detail.record && event.detail.record.fiatSession;
              if (session) {
                try {
                  const res = await fetch(`/api/follows/receipt-email?session=${encodeURIComponent(session)}`);
                  const data = await res.json();
                  if (data && data.email) prefill = data.email;
                } catch { /* still double opt-in if they type it */ }
              }
              const connected = event.detail && event.detail.record && event.detail.record.wallet;
              if (/^0x[a-f0-9]{40}$/.test(writer)) {
                window.OpenPaywallFollow.mount(document.getElementById("followPromptSlot"), {
                  writer,
                  author: name,
                  via: "post_unlock",
                  allowWallet: true,
                  connectedWallet: connected || "",
                  prefillEmail: prefill,
                  offerEmail: true,
                  openEmail: !connected,
                });
              }
            });
            document.getElementById("paywallHost").addEventListener("mon:connected", (event) => {
              const address = event.detail && event.detail.address;
              if (!address || !/^0x[a-f0-9]{40}$/.test(writer)) return;
              window.OpenPaywallFollow.mount(document.getElementById("followSlot"), {
                writer,
                author: article.author || "Author",
                via: "article",
                allowWallet: true,
                connectedWallet: address,
                primary: true,
              });
            });
          } catch (e) {
            status.className = "status error";
            status.textContent = "Could not load this article.";
            console.error(e);
          }
        }

        main();
      })();
    </script>
  </body>
</html>

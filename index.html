<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo — Open Paywall</title>
    <meta
      name="description"
      content="See how readers unlock on Open Paywall — card, Apple Pay, or USDC. Simulated preview only."
    />
    <link rel="llms-txt" href="/llms.txt" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111827;
        --muted: #57534e;
        --soft: #78716c;
        --line: #e7e5e4;
        --paper: #fafaf9;
        --surface: #ffffff;
        --accent: #7c3aed;
        --page-pad: 2rem;
        --font-serif: "Literata", Georgia, serif;
        --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--surface);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent);
      }

      .wrap {
        width: min(42rem, 100%);
        margin: 0 auto;
        padding-left: var(--page-pad);
        padding-right: var(--page-pad);
      }

      .hero {
        padding: 1.25rem 0 1.75rem;
        background: var(--surface);
      }

      .hero #site-nav {
        margin-bottom: 1.25rem !important;
      }

      .kicker {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand {
        margin: 0;
        font-family: var(--font-serif);
        font-size: clamp(2.5rem, 8vw, 3.25rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 0.95;
        text-align: left;
      }

      .lede {
        margin: 0.75rem 0 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.45;
        text-align: left;
      }

      .demo {
        padding: 1.75rem 0 2rem;
        background: var(--paper);
        border-top: 1px solid var(--line);
      }

      .demo-intro {
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .demo-intro h2 {
        margin: 0;
        font-family: var(--font-serif);
        font-size: clamp(1.6rem, 4vw, 1.85rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .demo-intro p {
        margin: 0.75rem auto 0;
        max-width: 28rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .demo-video {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #000;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      }

      .demo-note {
        margin: 0.85rem 0 0;
        text-align: center;
        font-size: 0.875rem;
        color: var(--soft);
      }

      #site-footer {
        margin-top: 2.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero" aria-label="Open Paywall demo">
      <div class="wrap">
        <div id="site-nav"></div>
        <p class="kicker">Demo</p>
        <h1 class="brand">Open Paywall</h1>
        <p class="lede">Unlock premium content with Monad or fiat</p>
      </div>
    </section>

    <section class="demo" id="demo" aria-labelledby="demo-heading">
      <div class="wrap">
        <div class="demo-intro">
          <h2 id="demo-heading">See it in action</h2>
          <p>How readers unlock — card, Apple Pay, or USDC. Nothing on this page takes payment.</p>
        </div>
        <video
          class="demo-video"
          autoplay
          muted
          loop
          playsinline
          controls
          preload="auto"
          aria-label="Simulated Open Paywall unlock demo"
        >
          <source src="/assets/unlock-demo.mp4?v=2" type="video/mp4" />
        </video>
        <p class="demo-note">
          Simulated preview only. For a live post, use
          <a href="/write">Write</a>.
        </p>
        <div id="site-footer"></div>
      </div>
    </section>

    <script src="/site-nav.js"></script>
    <script>
      (function () {
        function glyphLeft(el) {
          const node = el.firstChild;
          if (!node || node.nodeType !== Node.TEXT_NODE) {
            return el.getBoundingClientRect().left;
          }
          const range = document.createRange();
          range.setStart(node, 0);
          range.setEnd(node, 1);
          return range.getBoundingClientRect().left;
        }

        function alignOpenAndUnlock() {
          const brand = document.querySelector(".brand");
          const lede = document.querySelector(".lede");
          if (!brand || !lede) return;
          brand.style.marginLeft = "0px";
          lede.style.marginLeft = "0px";
          const dx = glyphLeft(lede) - glyphLeft(brand);
          lede.style.marginLeft = -dx - 1 + "px";
        }

        const run = () => {
          alignOpenAndUnlock();
          requestAnimationFrame(() => {
            alignOpenAndUnlock();
            setTimeout(alignOpenAndUnlock, 150);
            setTimeout(alignOpenAndUnlock, 500);
          });
        };

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(run).catch(run);
        } else if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", run);
        } else {
          run();
        }
        window.addEventListener("resize", alignOpenAndUnlock);
      })();
    </script>
  </body>
</html>

# After Railway deploys the public site, run the existing HTTP smoke against
# https://openpaywall.app.
#
# Railway already posts GitHub deployment_status events (in_progress, success,
# failure, inactive). The site that owns openpaywall.app is environment
# "sparkling-transformation / production" (service "mon widget dashboard").
# empowering-surprise deploys the same commits and is ignored.
# Variable PROD_DEPLOY_ENVIRONMENT overrides that name.
#
# Success: poll GET /api/agents/health, then run scripts/smoke.mjs up to
# twice. The app does not expose a git SHA, so "live" means Railway reported
# success (its `/` healthcheck passed) and the public health endpoint is ok.
# Failure or error: do not smoke a deploy that never went live.
# inactive / in_progress are ignored.
#
# This repository is public, so a failure must not open a GitHub issue.
# Health and smoke are retried first. A confirmed failure fails this job,
# which is the private signal, and prints the rollback command. deployment_status
# is triggered by Railway, so GitHub's "you triggered this run" mail may not
# reach the repo owner. Scheduled-workflow mail (the uptime workflow) goes to
# the user who last changed that workflow's cron, or who last re-enabled it.
#
# Carlos: https://github.com/settings/notifications → System → Actions →
# Email. "Only notify for failed workflows" is enough. Watch this repository
# so Actions mail includes runs you did not click yourself.
#
# Optional private email, skipped unless both secrets are set
# (Resend is not set up yet):
#   Secret RESEND_API_KEY
#   Secret ALERT_EMAIL_TO
# From address is posts@mail.openpaywall.app, the same default as follow mail.
# The job still fails when the check fails, whether or not that mail is sent.
#
# Actions logs are public. They print check names and status codes only.
# The rollback step prints the public dashboard URL and the command name.
# It does not print RAILWAY_TOKEN.
#
# Auto-rollback is off unless BOTH are set:
#   Secret   RAILWAY_TOKEN            Railway account or project token
#   Variable PROD_AUTO_ROLLBACK=true
# Optional, if the service is recreated:
#   RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID, RAILWAY_ENVIRONMENT_ID
#
# Pull requests run the unit tests only.
name: post-deploy

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Origin to smoke (no trailing slash)
        required: false
        default: https://openpaywall.app
  pull_request:

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    if: github.event_name == 'pull_request'
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Post-deploy unit tests
        run: node --test scripts/post-deploy-smoke.test.mjs scripts/railway-rollback.test.mjs scripts/private-alert.test.mjs

  smoke:
    name: smoke
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment.environment == (vars.PROD_DEPLOY_ENVIRONMENT || 'sparkling-transformation / production') &&
        (
          github.event.deployment_status.state == 'success' ||
          github.event.deployment_status.state == 'failure' ||
          github.event.deployment_status.state == 'error'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Railway marked the deploy failed
        if: github.event_name == 'deployment_status' && (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error')
        run: |
          state="${{ github.event.deployment_status.state }}"
          case "$state" in
            failure|error) ;;
            *) state=fail ;;
          esac
          echo "railway status=${state}" | tee /tmp/post-deploy-log.txt
          exit 1

      - name: Smoke the live site
        if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
        env:
          BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://openpaywall.app' }}
          POST_DEPLOY_LOG: /tmp/post-deploy-log.txt
        run: node scripts/post-deploy-smoke.mjs

      - name: Print rollback instructions
        if: failure()
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: node scripts/railway-rollback.mjs | tee /tmp/rollback.txt

      - name: Email the failure when Resend is configured
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: post-deploy
          ALERT_SUMMARY_FILE: /tmp/post-deploy-log.txt
        run: node scripts/private-alert.mjs

      - name: Auto-rollback
        if: failure() && vars.PROD_AUTO_ROLLBACK == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROD_AUTO_ROLLBACK: ${{ vars.PROD_AUTO_ROLLBACK }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ "$PROD_AUTO_ROLLBACK" != "true" ]; then
            echo "Auto-rollback stayed off. It needs secret RAILWAY_TOKEN and variable PROD_AUTO_ROLLBACK=true."
            exit 0
          fi
          node scripts/railway-rollback.mjs --execute

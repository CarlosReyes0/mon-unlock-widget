# Supabase project configuration
# Run `supabase init` if you haven't already, then link this project.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[functions]
# verify_jwt only checks that Authorization is a JWT this project signed.
# The anon key embedded in the widget is such a JWT and is public, so it is
# NOT sufficient. Each handler below enforces its own secret or wallet signature.
# Callers still send Authorization: Bearer <anon JWT> so the gateway check passes.
# Shared secrets go in a dedicated header (x-indexer-secret, x-publish-secret,
# x-listing-admin-secret). Do not put the secret in Authorization while
# verify_jwt is true — the gateway rejects a non-JWT bearer before the function runs.

[functions.indexer]
verify_jwt = true # anon JWT at the gateway; INDEXER_SECRET via x-indexer-secret in the handler

[functions.article-body]
verify_jwt = true # public widget sends the anon JWT; paid body requires an unlock proof

[functions.register-article]
verify_jwt = true # anon JWT at the gateway; handler requires publishSig or REGISTER_PUBLISH_SECRET

[functions.update-listing]
verify_jwt = true # anon JWT at the gateway; handler requires listingSig or LISTING_ADMIN_SECRET

# backfill-unlock was removed from this tree. It inserted unlock rows with the
# service role while verify_jwt was false, so anyone who could call the deployed
# function could grant themselves article access. Do not restore it as a public
# unauthenticated endpoint, and do not deploy it with --no-verify-jwt. If a
# one-off backfill is ever required, keep it out of the public tree or require
# verify_jwt = true plus a shared-secret header, and refuse requests that lack
# that secret. Undeploy any live copy in the Supabase dashboard.

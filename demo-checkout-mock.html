<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-title" content="Open Paywall" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
    <title>Unlock — Open Paywall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c1917;
        --muted: #57534e;
        --paper: #f7f4ef;
        --card: #fffdf9;
        --line: #e7e0d6;
        --sage: #5b7c5a;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(1200px 600px at 10% -10%, #efe8dc 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e4ebe3 0%, transparent 50%),
          var(--paper);
      }
      .checkout-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .checkout-card {
        width: min(100%, 26rem);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 18px 50px rgba(28, 25, 23, 0.08);
      }
      .checkout-brand {
        margin: 0 0 0.75rem;
        font-family: Literata, Georgia, serif;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
      .checkout-title { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
      .checkout-price { margin: 1.25rem 0 0.75rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
      .checkout-price span { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
      .checkout-copy { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
      .pay-btn {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font: inherit;
        font-weight: 600;
        background: #111827;
        color: #fff;
        cursor: default;
      }
      .pay-row {
        display: grid;
        gap: 0.6rem;
        margin: 1rem 0;
      }
      .pay-alt {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        font: inherit;
        font-weight: 600;
        background: #fff;
        color: var(--ink);
        cursor: default;
      }
      .checkout-link {
        display: block;
        width: 100%;
        margin-top: 0.75rem;
        border: 0;
        background: transparent;
        color: var(--sage);
        font: inherit;
        font-size: 0.9rem;
        text-align: center;
        cursor: pointer;
        text-decoration: underline;
      }
      .note {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="checkout-shell">
      <div class="checkout-card">
        <p class="checkout-brand">Open Paywall</p>
        <h1>Unlock article</h1>
        <p class="checkout-title">Why Every Founder Should Own Their Reader Relationship</p>
        <p class="checkout-price">$0.50 <span>USDC</span></p>
        <p class="checkout-copy">Pay with Apple Pay, Google Pay, or card. No wallet needed.</p>
        <div class="pay-row">
          <button type="button" class="pay-btn" disabled>Pay $0.50</button>
          <button type="button" class="pay-alt" disabled>Apple Pay / Google Pay</button>
        </div>
        <p class="checkout-copy" style="margin-top:1rem;margin-bottom:0.35rem;">Pay with USDC — lower fees</p>
        <button type="button" class="pay-alt" disabled>Pay $0.50 USDC — lower fees</button>
        <a class="checkout-link" href="/demo-unlock-recording.html">Cancel</a>
        <p class="note">Recording mock — no payment is processed</p>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6E54FF" />
    <meta name="apple-mobile-web-app-title" content="Open Paywall" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
    <title>Articles — Open Paywall</title>
    <meta
      name="description"
      content="Read paywalled articles hosted on Open Paywall. Unlock once, read on Open Paywall and on the publisher’s own site."
    />
    <meta
      name="base:app_id"
      content="6aab87b69b238d5ecd11e976"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111827;
        --muted: #57534e;
        --soft: #78716c;
        --line: #e7e5e4;
        --paper: #fafaf9;
        --surface: #ffffff;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
        --page-pad: 2rem;
        --font-serif: "Literata", Georgia, serif;
        --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 10% -10%, #ecfeff 0%, transparent 55%),
          radial-gradient(900px 400px at 100% 0%, #f0fdf4 0%, transparent 50%),
          var(--surface);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(42rem, 100%);
        margin: 0 auto;
        padding: 1.25rem var(--page-pad) 3rem;
      }
      .kicker {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0.35rem 0 0;
        font-family: var(--font-serif);
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .lede {
        margin: 0.75rem 0 0;
        color: var(--muted);
        max-width: 32rem;
        line-height: 1.55;
      }
      .mast {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
      }
      .write-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-bottom: 0.2rem;
        padding: 0.5rem 1.05rem;
        min-height: 2.5rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
      }
      .write-btn:hover { background: #115e59; }
      .write-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .feed {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .item {
        display: block;
        padding: 1.35rem 0;
        border-top: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .item:last-child { border-bottom: 1px solid var(--line); }
      .item:hover { background: rgba(15, 118, 110, 0.04); }
      .item:hover .title { color: var(--accent); }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.85rem;
        align-items: center;
        font-size: 0.8rem;
        color: var(--soft);
        margin-bottom: 0.35rem;
      }
      .price {
        display: inline-flex;
        align-items: center;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #115e59;
        font-weight: 600;
        font-size: 0.75rem;
      }
      .title {
        margin: 0;
        font-family: var(--font-serif);
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        transition: color 0.15s ease;
      }
      .teaser {
        margin: 0.45rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .also {
        margin: 0.55rem 0 0;
        font-size: 0.8rem;
        color: var(--soft);
      }
      .also a { color: var(--accent); }
      .empty, .error, .loading {
        margin-top: 2rem;
        padding: 1.5rem 0;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      .error { color: #b91c1c; }
      .mon-resume-draft {
        margin: 1.35rem 0 0;
        padding: 0.95rem 1rem;
        border: 1px solid #ccfbf1;
        background: #f0fdfa;
        border-radius: 12px;
      }
      .mon-resume-draft__kicker {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0f766e;
      }
      .mon-resume-draft a {
        display: inline-block;
        margin-top: 0.2rem;
        color: #0f766e;
        font-weight: 650;
        text-decoration: none;
      }
      .mon-resume-draft__hint {
        margin: 0.3rem 0 0;
        font-size: 0.85rem;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="site-nav"></div>
      <header class="mast">
        <div>
          <p class="kicker">Directory</p>
          <h1>Articles</h1>
        </div>
        <a class="write-btn" href="/write">Write</a>
      </header>
      <p class="lede">
        Writers opt in to list here. Each article shows its price up front and charges a real micropayment to unlock — not a free demo. Unlock once; read here and on the publisher’s site when they embed the same article.
      </p>
      <div id="resume-draft"></div>
      <div id="feed" class="feed" aria-live="polite">
        <p class="loading" id="status">Loading articles…</p>
      </div>
      <div id="site-footer"></div>
    </div>
    <script src="/site-nav.js"></script>
    <script src="/write-draft-resume.js"></script>
    <script>
      (function () {
        const SUPABASE_URL = "https://flczjqljgntmkanipugo.supabase.co";
        const SUPABASE_ANON_KEY =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsY3pqcWxqZ250bWthbmlwdWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MTUwNjQsImV4cCI6MjA5NzQ5MTA2NH0.ZKcFJ_4ZI4oK4hyZtR72vqC_JCdwttZSQQw82uTMEb4";

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function plainTeaser(htmlOrText) {
          const tmp = document.createElement("div");
          tmp.innerHTML = htmlOrText || "";
          return (tmp.textContent || "").trim();
        }

        function formatPrice(priceWei, paymentAsset) {
          try {
            const n = BigInt(priceWei);
            if (paymentAsset === "usdc") {
              const whole = n / 1000000n;
              const frac = n % 1000000n;
              const fracStr = frac.toString().padStart(6, "0").replace(/0+$/, "");
              return fracStr ? `$${whole}.${fracStr} USDC` : `$${whole} USDC`;
            }
            const whole = n / 10n ** 18n;
            const frac = n % 10n ** 18n;
            const fracStr = frac.toString().padStart(18, "0").slice(0, 4).replace(/0+$/, "");
            return fracStr ? `${whole}.${fracStr} MON` : `${whole} MON`;
          } catch {
            return paymentAsset === "usdc" ? "USDC" : "MON";
          }
        }

        function normalizeListingTitle(title) {
          return String(title || "")
            .replace(/[\u200B-\u200D\uFEFF\u2060]/g, "")
            .replace(/\s+/g, " ")
            .trim();
        }

        function dedupePublicArticles(articles) {
          const seen = new Set();
          const out = [];
          for (const a of articles || []) {
            const publisher = String(a.publisher || "").trim().toLowerCase();
            const titleKey = normalizeListingTitle(a.title || "").toLowerCase();
            const key = `${publisher}::${titleKey || String(a.slug || "").trim()}`;
            if (seen.has(key)) continue;
            seen.add(key);
            out.push({ ...a, title: normalizeListingTitle(a.title || a.slug) });
          }
          return out;
        }

        async function loadViaApi() {
          const res = await fetch("/api/articles?limit=50");
          if (!res.ok) throw new Error("api_" + res.status);
          const data = await res.json();
          return data.articles || [];
        }

        async function loadViaSupabase() {
          const qs =
            "select=article_id,title,author,teaser,price_wei,payment_asset,publisher,external_url,listed_at" +
            "&listing_status=eq.listed&article_id=not.is.null&order=listed_at.desc.nullslast&limit=50";
          const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?${qs}`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          });
          if (!res.ok) throw new Error("supabase_" + res.status);
          const rows = await res.json();
          return (rows || []).map((row) => ({
            slug: row.article_id,
            title: row.title || row.article_id,
            author: row.author || "Author",
            teaser: row.teaser || "",
            priceWei: String(row.price_wei || "0"),
            paymentAsset: row.payment_asset === "usdc" ? "usdc" : "mon",
            publisher: row.publisher || "",
            externalUrl: row.external_url || null,
            priceLabel: formatPrice(row.price_wei, row.payment_asset === "usdc" ? "usdc" : "mon"),
            href: `/articles/${encodeURIComponent(row.article_id)}`,
          }));
        }

        function render(articles) {
          const feed = document.getElementById("feed");
          feed.innerHTML = "";
          if (!articles.length) {
            feed.innerHTML =
              '<p class="empty">No listed articles yet. Writers can opt in from the embed generator or dashboard.</p>';
            return;
          }
          for (const a of articles) {
            const el = document.createElement("a");
            el.className = "item";
            el.href = a.href || `/articles/${encodeURIComponent(a.slug)}`;
            const teaser = plainTeaser(a.teaser);
            el.innerHTML = `
              <div class="meta">
                <span class="price">${escapeHtml(a.priceLabel || formatPrice(a.priceWei, a.paymentAsset))}</span>
                <span>${escapeHtml(a.author || "Author")}</span>
              </div>
              <h2 class="title">${escapeHtml(a.title || a.slug)}</h2>
              ${teaser ? `<p class="teaser">${escapeHtml(teaser)}</p>` : ""}
              ${
                a.externalUrl
                  ? `<p class="also">Also on <span>${escapeHtml(String(a.externalUrl).replace(/^https?:\/\//, ""))}</span></p>`
                  : ""
              }
            `;
            feed.appendChild(el);
          }
        }

        async function main() {
          const status = document.getElementById("status");
          try {
            let articles;
            try {
              articles = await loadViaApi();
            } catch {
              articles = await loadViaSupabase();
            }
            render(dedupePublicArticles(articles));
          } catch (e) {
            status.className = "error";
            status.textContent = "Could not load articles. Try again later.";
            console.error(e);
          }
        }

        main();
      })();
    </script>
  </body>
</html>

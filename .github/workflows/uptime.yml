# Read-only checks for https://openpaywall.app.
#
# GitHub delays the schedule on this public repo (runs land hours apart, not
# every 15 minutes). The cron below stays as the backup. When it does run it
# checks the homepage, the public feed, one article page (CSP included),
# agent health, and GET /api/uptime. A check is tried 3 times before it
# counts as a failure. A passing run exits 0 and sends nothing.
#
# Frequent checks are a free UptimeRobot account (5-minute HTTP monitors,
# email only). That needs no token and no new GitHub secret. A dispatch
# token or an in-app timer was the alternative: a token is an extra secret
# that can start workflows, and a timer inside the Railway process cannot
# report that the process is down. Do not create a public status page.
#
# This repository is public, so a failure must not open a GitHub issue.
# After the retries, a confirmed failure fails this job. GitHub then emails
# the user who last changed this scheduled workflow: the user who created it,
# or the user who last edited the cron line under on.schedule, or the user
# who last disabled and re-enabled the workflow. That email is private.
#
# Carlos: https://github.com/settings/notifications → System → Actions →
# Email. "Only notify for failed workflows" is enough. If the mail is not
# arriving, disable and re-enable "uptime" on the Actions tab while logged
# in as yourself. That points the schedule notification at you.
#
# Optional second private email, skipped unless both secrets are set
# (Resend is not set up yet):
#   Secret RESEND_API_KEY
#   Secret ALERT_EMAIL_TO
# From address is posts@mail.openpaywall.app, the same default as follow mail.
# The job still fails when the checks fail, whether or not that mail is sent.
#
# Actions logs are public. They print check names and status codes only.
#
# Enable the frequent checks (no repo secret):
#   1. Create a free account at https://uptimerobot.com with your email.
#   2. Add three HTTP(s) monitors, interval 5 minutes, alert contact = your
#      email. Leave status pages off.
#        https://openpaywall.app/
#        https://openpaywall.app/api/agents/health
#        https://openpaywall.app/api/uptime
#      Alert when the response is not HTTP 200.
#   3. Wait until Railway has deployed this commit, then open /api/uptime.
#      The backup job calls that path as soon as this file is on main. If a
#      run starts before the deploy finishes, that one run fails.
#      {"ok":true,"relayer":"ok"} and HTTP 200 means the relayer is funded.
#      "unset" means Railway has no relayer key. "low" means it is under the
#      line. "fail" means the balance read failed. The body has no address
#      and no balance.
#
# Rollback: delete or pause those three monitors. This schedule keeps
# running. Disable the "uptime" workflow on the Actions tab to stop the
# backup too. No secret was added, so there is nothing to rotate.
#
# The relayer decision is made on the server from the existing Railway
# secret RELAYER_PRIVATE_KEY. This workflow does not read RELAYER_ADDRESS.
# Do not add that variable. If the key is missing, /api/uptime says "unset"
# and this job fails.
#
# Optional Railway variable (not a GitHub variable):
#   RELAYER_LOW_BALANCE_WEI
#     Positive integer wei. Default 1000000000000000000 (1 MON), same as
#     RELAYER_LOW_BALANCE_WEI in server/relay-gas.mjs. Leave unset for the
#     default. This is the alert line, not a balance reading.
#
# Pull requests run the unit tests only. The schedule runs from main after merge.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: uptime-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    if: github.event_name == 'pull_request'
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Uptime and alert unit tests
        run: node --test scripts/uptime-check.test.mjs scripts/private-alert.test.mjs

  check:
    if: github.event_name != 'pull_request'
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Read-only production checks
        id: probe
        env:
          UPTIME_BASE_URL: https://openpaywall.app
          UPTIME_ATTEMPTS: "3"
          UPTIME_RETRY_MS: "5000"
          UPTIME_REPORT_PATH: /tmp/uptime-report.md
        run: node scripts/uptime-check.mjs
      - name: Email the failure when Resend is configured
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: uptime
          ALERT_SUMMARY_FILE: /tmp/uptime-report.md
        run: node scripts/private-alert.mjs

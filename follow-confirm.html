<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Confirm follow — Open Paywall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: #111827; background: #fff; }
      main { width: min(36rem, calc(100% - 2rem)); margin: 3rem auto; }
      h1 { font-family: Literata, Georgia, serif; font-weight: 600; font-size: 1.8rem; }
      p { color: #57534e; line-height: 1.5; }
      button {
        font: inherit; font-weight: 600; background: #0f766e; color: #fff;
        border: 0; border-radius: 999px; padding: 0.7rem 1.1rem; cursor: pointer;
      }
      a { color: #0f766e; }
      .item { padding: 0.8rem 0; border-top: 1px solid #e7e5e4; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Confirm you want these new posts</h1>
      <p id="lead">Click confirm to follow. Opening this page does not follow by itself.</p>
      <p><button type="button" id="confirm">Confirm</button></p>
      <p id="status"></p>
      <div id="posts"></div>
      <p><a href="/articles">All articles</a> · <a href="/privacy">Privacy</a></p>
    </main>
    <script>
      (function () {
        const token = new URLSearchParams(location.search).get("t") || "";
        const status = document.getElementById("status");
        const button = document.getElementById("confirm");
        if (!token) {
          button.hidden = true;
          status.className = "error";
          status.textContent = "This confirm link is missing a token.";
          return;
        }
        button.addEventListener("click", async () => {
          button.disabled = true;
          const res = await fetch("/api/follows/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ t: token }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            status.className = "error";
            status.textContent = res.status === 400 && data.error === "expired_token"
              ? "This confirm link has expired. Follow again to get a new one."
              : "This confirm link is not valid.";
            button.disabled = false;
            return;
          }
          try {
            if (data.followerToken) localStorage.setItem("opw_follower", data.followerToken);
          } catch { /* ignore */ }
          const name = data.displayName || "this writer";
          document.getElementById("title").textContent = `You're following ${name}`;
          document.getElementById("lead").textContent = "Follow free. Pay only for what you read.";
          button.hidden = true;
          status.textContent = "";
          const posts = document.getElementById("posts");
          for (const article of data.articles || []) {
            const el = document.createElement("article");
            el.className = "item";
            const a = document.createElement("a");
            a.href = article.href || `/articles/${encodeURIComponent(article.slug)}`;
            a.textContent = article.title || article.slug;
            el.appendChild(a);
            if (article.priceLine) {
              const p = document.createElement("p");
              p.textContent = article.priceLine;
              el.appendChild(p);
            }
            posts.appendChild(el);
          }
        });
      })();
    </script>
  </body>
</html>

# Supabase project configuration
# Run `supabase init` if you haven't already, then link this project.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[functions]
[functions.indexer]
verify_jwt = false # Triggered by pg_cron (see migrations/0005_schedule_indexer_cron.sql)

[functions.article-body]
verify_jwt = false # Called by the public widget with anon key
[functions.register-article]
verify_jwt = false # Called by the public generator (no user session)

# backfill-unlock was removed from this tree. It inserted unlock rows with the
# service role while verify_jwt was false, so anyone who could call the deployed
# function could grant themselves article access. Do not restore it as a public
# unauthenticated endpoint, and do not deploy it with --no-verify-jwt. If a
# one-off backfill is ever required, keep it out of the public tree or require
# verify_jwt = true plus a shared-secret header, and refuse requests that lack
# that secret. Undeploy any live copy in the Supabase dashboard.

# Scheduled read-only checks for https://openpaywall.app.
#
# Every 15 minutes: homepage, public feed, one article page (CSP included),
# agent health, and the gas-relayer MON balance. A check is tried 3 times
# before it counts as a failure. A passing run exits 0 and sends nothing.
#
# This repository is public, so a failure must not open a GitHub issue.
# After the retries, a confirmed failure fails this job. GitHub then emails
# the user who last changed this scheduled workflow: the user who created it,
# or the user who last edited the cron line under on.schedule, or the user
# who last disabled and re-enabled the workflow. That email is private.
#
# Carlos: https://github.com/settings/notifications → System → Actions →
# Email. "Only notify for failed workflows" is enough. If the mail is not
# arriving, disable and re-enable "uptime" on the Actions tab while logged
# in as yourself. That points the schedule notification at you.
#
# Optional second private email, skipped unless both secrets are set
# (Resend is not set up yet):
#   Secret RESEND_API_KEY
#   Secret ALERT_EMAIL_TO
# From address is posts@mail.openpaywall.app, the same default as follow mail.
# The job still fails when the checks fail, whether or not that mail is sent.
#
# Actions logs are public. They print check names and status codes only.
#
# Carlos — add these in GitHub → Settings → Secrets and variables → Actions.
# The workflow skips the balance check when the address is absent. It never
# creates production data.
#
#   Variable or secret RELAYER_ADDRESS
#     The relayer wallet (0x + 40 hex chars). A variable is enough; the
#     address is already public at GET /api/relay/health. Do not commit it.
#   Variable RELAYER_LOW_BALANCE_WEI   (optional)
#     Alert below this many wei. Default 1000000000000000000 (1 MON), same
#     as RELAYER_LOW_BALANCE_WEI in server/relay-gas.mjs.
#   Variable MONAD_RPC_URL              (optional)
#     Default https://rpc.monad.xyz. Read-only eth_getBalance.
#
# Pull requests run the unit tests only. The schedule runs from main after merge.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: uptime-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    if: github.event_name == 'pull_request'
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Uptime and alert unit tests
        run: node --test scripts/uptime-check.test.mjs scripts/private-alert.test.mjs

  check:
    if: github.event_name != 'pull_request'
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only production checks
        id: probe
        env:
          UPTIME_BASE_URL: https://openpaywall.app
          RELAYER_ADDRESS: ${{ vars.RELAYER_ADDRESS || secrets.RELAYER_ADDRESS }}
          RELAYER_LOW_BALANCE_WEI: ${{ vars.RELAYER_LOW_BALANCE_WEI }}
          MONAD_RPC_URL: ${{ vars.MONAD_RPC_URL || 'https://rpc.monad.xyz' }}
          UPTIME_ATTEMPTS: "3"
          UPTIME_RETRY_MS: "5000"
          UPTIME_REPORT_PATH: /tmp/uptime-report.md
        run: node scripts/uptime-check.mjs
      - name: Email the failure when Resend is configured
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: uptime
          ALERT_SUMMARY_FILE: /tmp/uptime-report.md
        run: node scripts/private-alert.mjs

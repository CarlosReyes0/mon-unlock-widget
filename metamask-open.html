<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in MetaMask</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0a0a0a;
        color: #ededed;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #171717;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      p {
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: #6366f1;
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.1s ease, background 0.1s ease;
      }
      .btn:active {
        transform: scale(0.985);
        background: #4f46e5;
      }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: #52525b;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin-bottom: 16px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="logo"
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect width="64" height="64" rx="12" fill="#6366f1" />
        <path
          d="M18 22 L32 14 L46 22 L46 42 L32 50 L18 42 Z"
          fill="white"
          fill-opacity="0.9"
        />
        <circle cx="32" cy="32" r="6" fill="#6366f1" />
      </svg>

      <h1>Open this page in MetaMask</h1>
      <p>
        Tap the button below to open the current article inside the MetaMask
        mobile browser where you can connect your wallet.
      </p>

      <a id="open-btn" class="btn" href="#">Open in MetaMask</a>

      <div class="hint">
        If the button doesn't open MetaMask, make sure the MetaMask app is
        installed and try again.
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const target = params.get("target");

        if (!target) {
          document.getElementById("open-btn").textContent =
            "Missing target parameter";
          document.getElementById("open-btn").style.pointerEvents = "none";
          document.getElementById("open-btn").style.opacity = "0.5";
          return;
        }

        // Build the official MetaMask universal link.
        // target should be a bare hostname (e.g. example.com) or a full URL.
        const bare = target.includes("://")
          ? target.replace(/^https?:\/\//, "")
          : target;

        const href = `https://link.metamask.io/dapp/${encodeURIComponent(bare)}`;
        document.getElementById("open-btn").href = href;
      })();
    </script>
  </body>
</html>
